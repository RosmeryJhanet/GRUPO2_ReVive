<div class="container">
  <div style="text-align: center;margin: 3%;"><h2>Registrar Materiales</h2></div>
  <div style="text-align: center;margin: 3%;">
    <form [formGroup]="form" (submit)="aceptar()">
      <mat-form-field class="example-full-width">
        <mat-label>Nombre de material</mat-label>
        <input matInput placeholder="Nombre del material" formControlName="name"/>
      </mat-form-field>
      <br />
      <mat-form-field>
        <mat-label>Descripción del material</mat-label>
        <textarea matInput formControlName="description"></textarea>
      </mat-form-field>
      <br />
      <mat-form-field>
        <mat-label>Tipo de material</mat-label>
        <input matInput placeholder="Ej: Plástico, Metal, Madera" formControlName="type"/>
      </mat-form-field>

      <div>
            <button matButton="elevated">Registrar</button>
      </div>
    </form>
  </div>
</div>
