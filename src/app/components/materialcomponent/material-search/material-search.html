<div class="container">
  <div class="card">
    <div class="card-header">
      <mat-icon>search</mat-icon>
      <h2>Buscar Material por Tipo</h2>
    </div>

    <div class="card-body">
      <form [formGroup]="form">
        <mat-form-field appearance="outline" class="campo">
          <mat-label>Tipo de material</mat-label>
          <input matInput formControlName="type" placeholder="Ej: Plástico" />
          <mat-icon matSuffix>label</mat-icon>
        </mat-form-field>
        <button mat-raised-button class="btn-buscar" type="button" (click)="buscar()">
          <mat-icon>search</mat-icon>
          Buscar
        </button>
      </form>

      <div class="resultado" *ngIf="dataSource.data.length > 0">
        <h3>Resultados</h3>
        <table mat-table [dataSource]="dataSource">
          <ng-container matColumnDef="c1">
            <th mat-header-cell *matHeaderCellDef> ID </th>
            <td mat-cell *matCellDef="let element"> {{ element.idMaterial }} </td>
          </ng-container>
          <ng-container matColumnDef="c2">
            <th mat-header-cell *matHeaderCellDef> Nombre </th>
            <td mat-cell *matCellDef="let element"> {{ element.materialName }} </td>
          </ng-container>
          <ng-container matColumnDef="c3">
            <th mat-header-cell *matHeaderCellDef> Tipo </th>
            <td mat-cell *matCellDef="let element"> {{ element.materialType }} </td>
          </ng-container>
          <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
          <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>
        </table>
      </div>

      <div class="no-encontrado" *ngIf="noEncontrado">
        <mat-icon>search_off</mat-icon>
        <p>No se encontraron materiales para ese tipo.</p>
      </div>
    </div>
  </div>
</div>
