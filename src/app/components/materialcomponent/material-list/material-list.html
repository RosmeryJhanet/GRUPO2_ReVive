<div class="lista-container">
  <h2 class="lista-titulo">
    <mat-icon>recycling</mat-icon>
    Lista de Materiales
  </h2>

  <p class="total-registros">Total de materiales: {{ materiales.length }}</p>

  <div class="cards-grid">
    @for (m of materiales; track m.idMaterial) {
      <mat-card class="material-card">

        <div class="card-imagen-wrap">
          <img [src]="getImagen(m.materialType)" [alt]="m.materialType" class="card-imagen" />
        </div>

        <div class="card-nombre">{{ m.materialName }}</div>

        <span class="card-tipo">{{ m.materialType }}</span>

        <mat-divider></mat-divider>

        <div class="card-info">
          <div class="card-fila">
            <span class="card-label">Descripción:</span>
            <span class="card-valor">{{ m.materialDescription }}</span>
          </div>
        </div>

        <mat-divider></mat-divider>

        <div class="card-acciones">
          <button mat-button class="btn-editar" [routerLink]="['/materiales/edits', m.idMaterial]">Editar</button>
          <button mat-button class="btn-eliminar" (click)="eliminar(m.idMaterial)">Eliminar</button>
        </div>

      </mat-card>
    }
  </div>

  @if (materiales.length === 0) {
    <p class="sin-datos">No hay materiales registrados.</p>
  }
</div>
