<div class="container">
    <h2>Lista de materiales</h2>
    <div>
        <table mat-table [dataSource]="dataSource" class="mat-elevation-z8">



            <!--- Note that these columns can be defined in any order.

    The actual rendered columns are set as a property on the row definition" -->



            <!-- Position Column -->

            <ng-container matColumnDef="c1">

                <th mat-header-cell *matHeaderCellDef> ID. </th>

                <td mat-cell *matCellDef="let element"> {{element.idMaterial}} </td>

            </ng-container>



            <!-- Name Column -->

            <ng-container matColumnDef="c2">

                <th mat-header-cell *matHeaderCellDef> Material </th>

                <td mat-cell *matCellDef="let element"> {{element.materialName}} </td>

            </ng-container>



            <!-- Weight Column -->

            <ng-container matColumnDef="c3">

                <th mat-header-cell *matHeaderCellDef> Descripción </th>

                <td mat-cell *matCellDef="let element"> {{element.materialDescription}} </td>

            </ng-container>



            <!-- Symbol Column -->

            <ng-container matColumnDef="c4">

                <th mat-header-cell *matHeaderCellDef> Tipo</th>

                <td mat-cell *matCellDef="let element"> {{element.materialType}} </td>

            </ng-container>
            <!-- Symbol Column -->
             <ng-container matColumnDef="c5">
                <th mat-header-cell *matHeaderCellDef> Eliminar </th>
                <td mat-cell *matCellDef="let element">
                    <button matButton (click)="eliminar(element.idMaterial)" class="btn-eliminar">
                        <mat-icon>delete</mat-icon>
                    </button>                    
                </td>
            </ng-container>


            <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>

            <tr mat-row *matRowDef="let row; columns: displayedColumns;"></tr>

        </table>
    </div>
</div>
