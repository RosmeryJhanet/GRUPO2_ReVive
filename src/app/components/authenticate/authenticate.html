<div class="login-fondo">
  <div class="login-card">
    <button class="btn-cerrar" type="button" (click)="irAHome()" aria-label="Cerrar">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="white">
        <path d="M19 6.41L17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/>
      </svg>
    </button>
    <div class="login-logo">
      <img src="logo_rev.png" alt="ReVive" />
    </div>

    <h1 class="login-brand">Inicie sesión</h1>
    <form class="login-form" (ngSubmit)="login()">
      <label class="campo-label">CORREO</label>
      <div class="campo-input-wrapper">
        <svg class="campo-icon" viewBox="0 0 24 24" width="18" height="18" fill="#2e5c2f">
          <path
            d="M12 12c2.76 0 5-2.24 5-5s-2.24-5-5-5-5 2.24-5 5 2.24 5 5 5zm0 2c-3.33 0-10 1.67-10 5v3h20v-3c0-3.33-6.67-5-10-5z"
          />
        </svg>
        <input class="campo-input" type="email" [(ngModel)]="useremail" name="useremail" required />
      </div>

      <label class="campo-label">CONTRASEÑA</label>
      <div class="campo-input-wrapper">
        <svg class="campo-icon" viewBox="0 0 24 24" width="18" height="18" fill="#2e5c2f">
          <path
            d="M18 8h-1V6c0-2.76-2.24-5-5-5S7 3.24 7 6v2H6c-1.1 0-2 .9-2 2v10c0 1.1.9 2 2 2h12c1.1 0 2-.9 2-2V10c0-1.1-.9-2-2-2zM9 6c0-1.66 1.34-3 3-3s3 1.34 3 3v2H9V6zm3 12c-1.1 0-2-.9-2-2s.9-2 2-2 2 .9 2 2-.9 2-2 2z"
          />
        </svg>
        <input class="campo-input campo-input-password" [type]="mostrarPassword ? 'text' : 'password'" [(ngModel)]="userpassword" name="userpassword" required />
        <button class="btn-ojito" type="button" (click)="togglePassword()" aria-label="Ver contraseña">
          <svg viewBox="0 0 24 24" width="18" height="18" fill="#2e5c2f">
            @if (mostrarPassword) {
              <path d="M12 7c2.76 0 5 2.24 5 5 0 .65-.13 1.26-.36 1.83l2.92 2.92c1.51-1.26 2.7-2.89 3.43-4.75-1.73-4.39-6-7.5-11-7.5-1.4 0-2.74.25-3.98.7l2.16 2.16C10.74 7.13 11.35 7 12 7zM2 4.27l2.28 2.28.46.46C3.08 8.3 1.78 10.02 1 12c1.73 4.39 6 7.5 11 7.5 1.55 0 3.03-.3 4.38-.84l.42.42L19.73 22 21 20.73 3.27 3 2 4.27zM7.53 9.8l1.55 1.55c-.05.21-.08.43-.08.65 0 1.66 1.34 3 3 3 .22 0 .44-.03.65-.08l1.55 1.55c-.67.33-1.41.53-2.2.53-2.76 0-5-2.24-5-5 0-.79.2-1.53.53-2.2zm4.31-.78l3.15 3.15.02-.16c0-1.66-1.34-3-3-3l-.17.01z"/>
            } @else {
              <path d="M12 4.5C7 4.5 2.73 7.61 1 12c1.73 4.39 6 7.5 11 7.5s9.27-3.11 11-7.5c-1.73-4.39-6-7.5-11-7.5zM12 17c-2.76 0-5-2.24-5-5s2.24-5 5-5 5 2.24 5 5-2.24 5-5 5zm0-8c-1.66 0-3 1.34-3 3s1.34 3 3 3 3-1.34 3-3-1.34-3-3-3z"/>
            }
          </svg>
        </button>
      </div>

      <button type="submit" class="btn-ingresar">INICIAR SESIÓN</button>
    </form>
    <p class="login-registro">
      ¿No tienes cuenta? <a routerLink="/registro">Regístrate</a>
    </p>
  </div>
</div>
