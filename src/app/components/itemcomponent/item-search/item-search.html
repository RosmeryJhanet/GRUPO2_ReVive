<div class="container">
  <div class="card">
    <div class="card-header">
      <mat-icon>search</mat-icon>
      <h2>Buscar Artículo</h2>
    </div>

    <div class="card-body">
      <form [formGroup]="form">
        <mat-form-field appearance="outline" class="campo">
          <mat-label>ID del artículo</mat-label>
          <input matInput formControlName="id" type="number" placeholder="Ej: 1" />
          <mat-icon matSuffix>tag</mat-icon>
        </mat-form-field>

        <button mat-raised-button class="btn-buscar" type="button" (click)="buscar()">
          <mat-icon>search</mat-icon>
          Buscar
        </button>
      </form>

      <div class="resultado" *ngIf="resultado">
        <h3>Resultado</h3>
        <table>
          <tr>
            <td class="label">ID</td>
            <td>{{ resultado.itemId }}</td>
          </tr>
          <tr>
            <td class="label">Nombre</td>
            <td>{{ resultado.itemName }}</td>
          </tr>
          <tr>
            <td class="label">Descripción</td>
            <td>{{ resultado.itemDescription }}</td>
          </tr>
          <tr>
            <td class="label">Condición</td>
            <td>{{ resultado.itemCondition }}</td>
          </tr>
          <tr>
            <td class="label">ID Categoría</td>
            <td>{{ resultado.idCategory }}</td>
          </tr>
        </table>
      </div>

      <div class="no-encontrado" *ngIf="noEncontrado">
        <mat-icon>search_off</mat-icon>
        <p>No se encontró ningún artículo con ese ID.</p>
      </div>
    </div>
  </div>
</div>
