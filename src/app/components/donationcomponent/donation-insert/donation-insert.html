<div class="container">
  <div class="card">
    <div class="card-header">
      <mat-icon>loyalty</mat-icon>
      <h2>Registrar Donacion</h2>
    </div>

    <div class="card-body">
      <form [formGroup]="form">
        <mat-form-field appearance="outline" class="campo">
          <mat-label>Descripción de la donación</mat-label>

          <textarea matInput formControlName="namedonation" rows="3"> </textarea>

          <mat-hint align="end"> {{ form.get('namedonation')?.value?.length || 0 }} / 25 </mat-hint>

          <mat-error *ngIf="form.get('namedonation')?.hasError('required')">
            La descripción es obligatoria
          </mat-error>

          <mat-error *ngIf="form.get('namedonation')?.hasError('maxlength')">
            Máximo 25 caracteres permitidos
          </mat-error>
        </mat-form-field>

        <mat-form-field appearance="outline" class="campo">
          <mat-label>Item</mat-label>
          <mat-select formControlName="itemid">
            <mat-option *ngFor="let item of listaitems" [value]="item.itemId">
              {{ item.itemName }}
            </mat-option>
          </mat-select>
          <mat-icon matSuffix>work</mat-icon>
          <mat-error *ngIf="form.get('itemid')?.hasError('required')"
            >El item es obligatorio.</mat-error
          >
        </mat-form-field>

        <mat-form-field appearance="outline" class="campo">
          <mat-label>usuario</mat-label>
          <mat-select formControlName="userid">
            <mat-option *ngFor="let usuario of listausuarios" [value]="usuario.idUser">
              {{ usuario.userName }}
            </mat-option>
          </mat-select>
          <mat-icon matSuffix>face</mat-icon>
          <mat-error *ngIf="form.get('userid')?.hasError('required')"
            >El usuario es obligatorio.</mat-error
          >
        </mat-form-field>
      </form>
    </div>

    <div class="card-actions">
      <button mat-button class="btn-cancelar" routerLink="/items/listar">Cancelar</button>
      <button mat-raised-button class="btn-guardar" (click)="aceptar()">
        <mat-icon>save</mat-icon>
        Registrar
      </button>
    </div>
  </div>
</div>
