<div class="container">
  <div class="card">
    <div class="card-header">
      <mat-icon>search</mat-icon>
      <h2>Buscar Donacion</h2>
    </div>

    <div class="card-body">
      <form [formGroup]="form">
        <mat-form-field appearance="outline" class="campo">
          <mat-label>ID de la Donacion</mat-label>
          <input matInput formControlName="id" type="number" placeholder="Ej: 1" />
          <mat-icon matSuffix>loyalty</mat-icon>
        </mat-form-field>

        <button mat-raised-button class="btn-buscar" type="button" (click)="buscar()">
          <mat-icon>search</mat-icon>
          Buscar
        </button>
      </form>

      <div class="resultado" *ngIf="resulta">
        <h3>Resultado</h3>
        <table>
          <tr>
            <td class="label">ID</td>
            <td>{{ resulta.idDonation }}</td>
          </tr>
          <tr>
            <td class="label">Descripcion de donacion</td>
            <td>{{ resulta.nameDonation }}</td>
          </tr>
          <tr>
            <td class="label">Id item</td>
            <td>{{ resulta.itemId }}</td>
          </tr>
          <tr>
            <td class="label">Id user</td>
            <td>{{ resulta.idUser }}</td>
          </tr>
        </table>
      </div>

      <div class="no-encontrado" *ngIf="noEncontrado">
        <mat-icon>search_off</mat-icon>
        <p>No se encontró ninguna donación con ese ID.</p>
      </div>
    </div>
  </div>
</div>
