<div style="padding: 24px">
  <h2 style="color: var(--mat-sys-primary); margin-bottom: 16px">
    <mat-icon>group_off</mat-icon>
    Usuarios sin trueque
  </h2>

  <table
    mat-table
    [dataSource]="dataSource"
    style="width: 100%; border-radius: 8px; overflow: hidden"
  >
    <!-- ID -->
    <ng-container matColumnDef="c1">
      <th mat-header-cell *matHeaderCellDef>ID</th>
      <td mat-cell *matCellDef="let element">{{ element.idUser }}</td>
    </ng-container>

    <!-- Nombre -->
    <ng-container matColumnDef="c2">
      <th mat-header-cell *matHeaderCellDef>Nombre</th>
      <td mat-cell *matCellDef="let element">{{ element.UserName }}</td>
    </ng-container>

    <!-- Email -->
    <ng-container matColumnDef="c3">
      <th mat-header-cell *matHeaderCellDef>Email</th>
      <td mat-cell *matCellDef="let element">{{ element.UserEmail }}</td>
    </ng-container>

    <!-- Fecha de registro -->
    <ng-container matColumnDef="c4">
      <th mat-header-cell *matHeaderCellDef>Fecha de registro</th>
      <td mat-cell *matCellDef="let element">{{ element.UserRegistrationDate | date:'dd/MM/yyyy' }}</td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
  </table>

  <div class="paginator-footer">
    <span class="total-registros">Total de usuarios: {{ dataSource.data.length }}</span>
    <mat-paginator
      [pageSizeOptions]="[5, 10, 25]"
      [pageSize]="5"
      showFirstLastButtons
      aria-label="Seleccionar página de usuarios sin trueque"
    ></mat-paginator>
  </div>
</div>
