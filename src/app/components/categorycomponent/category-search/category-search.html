<div class="container">
  <div class="card">
    <div class="card-header">
      <mat-icon>search</mat-icon>
      <h2>Buscar Categoría</h2>
    </div>

    <div class="card-body">
      <form [formGroup]="form">
        <mat-form-field appearance="outline" class="campo">
          <mat-label>ID de la categoría</mat-label>
          <input matInput formControlName="id" type="number" placeholder="Ej: 1" />
          <mat-icon matSuffix>tag</mat-icon>
        </mat-form-field>
        <button mat-raised-button class="btn-buscar" type="button" (click)="buscar()">
          <mat-icon>search</mat-icon>
          Buscar
        </button>
      </form>

      <div class="resultado" *ngIf="resultado">
        <h3>Resultado</h3>
        <table>
          <tr>
            <td class="label">ID</td>
            <td>{{ resultado.idCategory }}</td>
          </tr>
          <tr>
            <td class="label">Nombre</td>
            <td>{{ resultado.nameCategory }}</td>
          </tr>
          <tr>
            <td class="label">Descripción</td>
            <td>{{ resultado.descriptionCategory }}</td>
          </tr>
          <tr>
            <td class="label">Estado</td>
            <td>{{ resultado.stateCategory ? 'Activo' : 'Inactivo' }}</td>
          </tr>
        </table>
      </div>

      <div class="no-encontrado" *ngIf="noEncontrado">
        <mat-icon>search_off</mat-icon>
        <p>No se encontró ninguna categoría con ese ID.</p>
      </div>
    </div>
  </div>
</div>
