<div class="container">
  <div class="card">
    <div class="card-header">
      <mat-icon>category</mat-icon>
      <h2>Registrar Categorías</h2>
    </div>

    <div class="card-body">
      <form [formGroup]="form">
        <mat-form-field appearance="outline" class="campo">
          <mat-label>Nombre de categoría</mat-label>
          <input matInput formControlName="name" placeholder="Ej: Reciclaje">
          <mat-icon matSuffix>label</mat-icon>
        </mat-form-field>

        <mat-form-field appearance="outline" class="campo">
          <mat-label>Descripción</mat-label>
          <textarea matInput formControlName="description" placeholder="Ej: Materiales reciclables"></textarea>
          <mat-icon matSuffix>description</mat-icon>
        </mat-form-field>

        <mat-form-field appearance="outline" class="campo">
          <mat-label>Estado</mat-label>
          <mat-select formControlName="state">
            <mat-option [value]="true">Activo</mat-option>
            <mat-option [value]="false">Inactivo</mat-option>
          </mat-select>
          <mat-icon matSuffix>toggle_on</mat-icon>
        </mat-form-field>
      </form>
    </div>

    <div class="card-actions">
      <button mat-button class="btn-cancelar" routerLink="/categorias/listar">
        Cancelar
      </button>
      <button mat-raised-button class="btn-guardar" (click)="aceptar()">
        <mat-icon>save</mat-icon>
        Registrar
      </button>
    </div>
  </div>
</div>
